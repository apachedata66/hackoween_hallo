[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostdata"
version = "0.1.0"
description = "Ghost Data Still Exists - evidence-backed deletion audit agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pypdf==6.17.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
ui = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evaluation", "code"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# SQL fixture strings are data; their line length is not code style.
"tests/test_sql_snapshots.py" = ["E501"]
"code/evaluation/report.py" = ["E402"]
